name: TestJava

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit and Hamcrest
        run: |
          mkdir -p lib
          curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile source and test code
        run: |
          mkdir -p out
          find src -name "*.java" > sources.txt
          find test -name "*.java" >> sources.txt
          javac -cp "lib/*" -d out @sources.txt

      - name: Run tests
        run: |
          java -cp "out:lib/*" org.junit.runner.JUnitCore MessageTest
